    }

    .arcade-loading-bar::before {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4aa3ff, #b7ff3d);
      animation: arcadeLoadingSweep 1.05s ease-in-out infinite;
    }

    body.is-arcade-ready .arcade-loading {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    body.is-arcade-exiting .arcade-loading {

      visibility: visible;
      pointer-events: auto;
    }

  <script>
    (function installArcadeExitGuard() {
      var HOME_PATH = "/";
      var redirecting = false;
      var boundIframe = null;
      var firstIframeLoadSeen = false;
      var loadingTitle = document.getElementById("arcade-loading-title");

      function setLoadingText(text) {
        if (loadingTitle) loadingTitle.textContent = text;
      }

      function goHome() {
        if (redirecting) return;
        redirecting = true;
        document.body.classList.remove("is-arcade-ready");
        document.body.classList.add("is-arcade-exiting");
        setLoadingText("Returning home");
        try {
          window.location.replace(new URL(HOME_PATH, window.location.origin).href);
        } catch (_error) {
          window.location.href = HOME_PATH;
        }
      }

      window.addEventListener("message", function (event) {
        var data = event && event.data ? event.data : null;
        if (!data || data.type !== "cavbot:arcade:navigate") return;

        try {
          var target = new URL(data.href || HOME_PATH, window.location.origin);
          if (target.origin !== window.location.origin) return;
          redirecting = true;
          document.body.classList.remove("is-arcade-ready");
          document.body.classList.add("is-arcade-exiting");
          setLoadingText("Returning home");
          window.location.replace(target.href);
        } catch (_error) {
          goHome();
        }
      });

      function bindArcadeFrame() {
        var frame = document.querySelector("#cavbot-arcade-root iframe");
        if (!frame || frame === boundIframe) return;

        boundIframe = frame;
        firstIframeLoadSeen = false;

        frame.setAttribute(
          "sandbox",
          "allow-scripts allow-same-origin allow-top-navigation-by-user-activation"
        );

        frame.addEventListener("load", function () {
          if (!firstIframeLoadSeen) {
            firstIframeLoadSeen = true;
            document.body.classList.add("is-arcade-ready");
            return;
          }

          goHome();
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindArcadeFrame);
      } else {
        bindArcadeFrame();
      }

      var observer = new MutationObserver(bindArcadeFrame);
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
