  <style>
    /* =====================================================
       RESET
    ====================================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #01030f;
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100svh;
      overflow: hidden;

      color: #f7fbff;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    /* =====================================================
       PAGE
    ====================================================== */

    .error-page {
      --x: 0;
      --y: 0;

      position: relative;

      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;

      background: #01030f;
    }

    /* =====================================================
       QUIET VIOLET DEPTH
    ====================================================== */

    .error-page::before {
      content: "";

      position: absolute;
      inset: -30%;

      z-index: -2;

      pointer-events: none;


      transition: background-position 180ms ease-out;
    }

    .error-page::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: -1;

      pointer-events: none;

    }

    /* =====================================================
       HEADER
    ====================================================== */

    .error-header {
      position: absolute;
      top: 0;
      left: 0;

      z-index: 20;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        max(28px, env(safe-area-inset-top))
        clamp(24px, 4vw, 64px)
        0;
    }

    .error-brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .error-brand img {
      display: block;

      width: clamp(110px, 8vw, 138px);
      height: auto;
    }

    .error-header-mark {
      margin: 0;

      color: rgba(247, 251, 255, 0.4);

      font-size: 10px;
      font-weight: 650;
      line-height: 1;

      letter-spacing: 0.02em;
    }

    /* =====================================================
       GIANT 404
    ====================================================== */

    .error-figure {
      position: absolute;
      top: 50%;
      left: -2.5vw;

      z-index: 1;

      transform:
        translate3d(
          calc(var(--x) * 10px),
          calc(-50% + (var(--y) * 7px)),
          0
        );

      pointer-events: none;
      user-select: none;

      transition: transform 120ms linear;
    }

    .error-number {
      margin: 0;

      display: flex;
      align-items: center;

      color: rgba(247, 251, 255, 0.095);

      font-size: clamp(390px, 45vw, 860px);
      font-weight: 750;
      line-height: 0.7;

      letter-spacing: -0.105em;

      white-space: nowrap;
    }

    .error-number span {
      display: block;
    }

    .error-number span:nth-child(1) {
      color: rgba(247, 251, 255, 0.045);

      transform:
        translate3d(
          calc(var(--x) * -7px),
          calc(var(--y) * -5px),
          0
        );
    }

    .error-number span:nth-child(2) {
      color: rgba(247, 251, 255, 0.105);

      transform:
        translate3d(
          calc(var(--x) * 3px),
          calc(var(--y) * 2px),
          0
        );
    }

    .error-number span:nth-child(3) {
      color: rgba(247, 251, 255, 0.055);

      transform:
        translate3d(
          calc(var(--x) * 8px),
          calc(var(--y) * 5px),
          0
        );
    }

    /* =====================================================
       CONTENT
    ====================================================== */

    .error-content {
      position: relative;

      z-index: 10;

      min-height: 100svh;

      display: grid;
      grid-template-columns:
        minmax(0, 1.4fr)
        minmax(340px, 0.6fr);

      align-items: center;

      padding:
        110px
        clamp(24px, 5vw, 80px)
        72px;
    }

    .error-copy {
      grid-column: 2;

      width: min(100%, 520px);

      justify-self: end;

      transform:
        translate3d(
          calc(var(--x) * -3px),
          calc(var(--y) * -2px),
          0
        );

      transition: transform 120ms linear;
    }

    .error-copy h1 {
      max-width: 520px;

      margin: 0;

      color: #f7fbff;

      font-size: clamp(52px, 5.2vw, 86px);
      font-weight: 620;
      line-height: 0.94;

      letter-spacing: -0.058em;
    }

    .error-message {
      max-width: 410px;

      margin: 28px 0 0;

      color: #8890aa;

      font-size: clamp(16px, 1.18vw, 18px);
      font-weight: 400;
      line-height: 1.62;
    }

    /* =====================================================
       ACTIONS
    ====================================================== */

    .error-actions {
      margin-top: 38px;

      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 26px;
    }

    .error-home {
      text-decoration: none;
    }

    .error-recovery {
      position: relative;

      padding: 8px 0;

      color: rgba(247, 251, 255, 0.76);

      font-size: 13px;
      font-weight: 650;

      text-decoration: none;
    }

    .error-recovery::after {
      content: "";

      position: absolute;
      right: 0;
      bottom: 2px;
      left: 0;

      height: 1px;

      background: currentColor;

      transform: scaleX(0.3);
      transform-origin: left;

      opacity: 0.5;

      transition: transform 180ms ease;
    }

    .error-recovery:hover::after {
      transform: scaleX(1);
    }

    .error-home:focus-visible,
    .error-recovery:focus-visible,
    .error-brand:focus-visible {
      outline: 2px solid #4ea8ff;
      outline-offset: 4px;
    }

    /* =====================================================
       PATH
    ====================================================== */

    .error-path {
      position: absolute;
      right: clamp(64px, 6vw, 104px);
      bottom: 30px;

      z-index: 20;

      max-width: 42vw;

      margin: 0;

      overflow: hidden;

      color: rgba(247, 251, 255, 0.28);

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 9px;
      line-height: 1.4;

      letter-spacing: 0.08em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .error-header {
        padding:
          max(22px, env(safe-area-inset-top))
          22px
          0;
      }

      .error-figure {
        top: 39%;
        left: -22vw;
      }

      .error-number {
        font-size: clamp(360px, 72vw, 650px);
      }

      .error-content {
        min-height: 100svh;

        display: flex;
        align-items: flex-end;

        padding:
          110px
          24px
          88px;
      }

      .error-copy {
        width: min(100%, 560px);

        margin-left: auto;

        transform: none;
      }

      .error-copy h1 {
        max-width: 450px;
      }
    }

    @media (max-width: 560px) {
      .error-brand img {
        width: 102px;
      }

      .error-header-mark {
        font-size: 8px;
      }

      .error-figure {
        top: 36%;
        left: -57vw;
      }

      .error-number {
        font-size: clamp(360px, 112vw, 520px);
      }

      .error-content {
        padding:
          96px
          20px
          82px;
      }

      .error-copy h1 {
        max-width: 340px;

        font-size: clamp(46px, 14vw, 64px);
      }

      .error-message {
        max-width: 340px;

        margin-top: 22px;

        font-size: 15px;
      }

      .error-actions {
        margin-top: 30px;

        gap: 20px;
      }

      .error-home {
        min-height: 48px;
      }

      .error-path {
        right: 64px;
        bottom: 22px;

        max-width: calc(100vw - 84px);
      }
    }

    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {
      .error-figure,
      .error-copy,
      .error-number span {
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body data-cavbot-page-type="404">

  <main
    class="error-page"
    id="error-page"
  >

    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="error-header">

      <a
        class="error-brand"
        href="/"
        aria-label="CavBot home"
      >
        <img
          src="assets/logo/official-logotype-light.svg"
          alt="CavBot"
        >
      </a>

      <p class="error-header-mark" id="error-clock" aria-live="off">
        Sunday · 10:52 EST
      </p>

    </header>

    <!-- ===================================================
         404
    ==================================================== -->

    <div
      class="error-figure"
      aria-hidden="true"
    >
      <p class="error-number">
        <span>4</span>
        <span>0</span>
        <span>4</span>
      </p>
    </div>

    <!-- ===================================================
         CONTENT
    ==================================================== -->

    <section class="error-content">

      <div class="error-copy">

        <h1>
          Page not found <br>
          
        </h1>

        <p class="error-message">
          This page may have moved or no <br> longer exists.
          Let’s get you some-<br>where useful.
        </p>

        <nav
          class="error-actions"
          aria-label="Page not found actions"
        >

          <a
            class="error-home btn btn-primary"
            href="/"
          >
            Return home
          </a>

          <a
            class="error-recovery"
            href="https://app.cavbot.io/"
          >
            Dashboard
          </a>

        </nav>

      </div>

    </section>

    <p
      class="error-path"
      id="error-path"
      aria-label="Requested page"
    >
      /
    </p>

  </main>

  <script>
    (() => {
      const page =
        document.getElementById("error-page");

      const path =
        document.getElementById("error-path");

      const clock =
        document.getElementById("error-clock");

      if (path) {
        path.textContent =
          window.location.pathname +
          window.location.search +
          window.location.hash;
      }

      const updateClock = () => {
        if (!clock) return;

        const now = new Date();
        const timeZone = "America/New_York";
        const day = new Intl.DateTimeFormat("en-US", {
          weekday: "long",
          timeZone,
        }).format(now);
        const time = new Intl.DateTimeFormat("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone,
        }).format(now);
        const zone = new Intl.DateTimeFormat("en-US", {
          timeZone,
          timeZoneName: "short",
        }).formatToParts(now).find((part) => part.type === "timeZoneName")?.value || "ET";

        clock.textContent = `${day} · ${time} ${zone}`;
      };

      updateClock();
      window.setInterval(updateClock, 60_000);

      if (
        !page ||
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches
      ) {
        return;
      }

      let frame = null;
      let targetX = 0;
      let targetY = 0;
      let currentX = 0;
      let currentY = 0;

      const render = () => {
        currentX +=
          (targetX - currentX) * 0.08;

        currentY +=
          (targetY - currentY) * 0.08;

        page.style.setProperty(
          "--x",
          currentX.toFixed(4)
        );

        page.style.setProperty(
          "--y",
          currentY.toFixed(4)
        );

        const moving =
          Math.abs(targetX - currentX) > 0.001 ||
          Math.abs(targetY - currentY) > 0.001;

        frame = moving
          ? requestAnimationFrame(render)
          : null;
      };

      window.addEventListener(
        "pointermove",
        (event) => {
          targetX =
            (event.clientX / window.innerWidth - 0.5) * 2;

          targetY =
            (event.clientY / window.innerHeight - 0.5) * 2;

          if (!frame) {
            frame = requestAnimationFrame(render);
          }
        },
        { passive: true }
      );

      document.addEventListener(
        "mouseleave",
        () => {
          targetX = 0;
          targetY = 0;

          if (!frame) {
            frame = requestAnimationFrame(render);
          }
        }
      );
    })();
  </script>
